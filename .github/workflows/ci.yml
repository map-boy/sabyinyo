name: CI
on: [push, pull_request]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile data/scripts/*.py model/*.py training/*.py eval/*.py inference/*.py
      - name: Lint
        run: |
          pip install ruff
          ruff check .
      - name: Smoke test model forward pass
        run: |
          python -c "
          import torch
          from model.architecture import CodeGenModel
          m = CodeGenModel(vocab_size=100, dim=32, n_layers=2, n_heads=4, max_seq_len=16)
          x = torch.randint(0, 100, (1, 8))
          out = m(x)
          assert out.shape == (1, 8, 100)
          print('smoke test passed:', out.shape)
          "
